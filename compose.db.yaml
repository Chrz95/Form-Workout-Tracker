services:
  db:
    image: postgres:17-alpine
    command: ["postgres", "-p", "5433"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: form_local
      POSTGRES_PASSWORD: development_only
      POSTGRES_DB: form
    ports:
      - "127.0.0.1:5433:5433"
    volumes:
      - type: bind
        source: ${FORM_POSTGRES_DATA_DIR:-/home/pi/configs/form}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U form_local -d form -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10
