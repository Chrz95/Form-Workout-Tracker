worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # A private address literal or mDNS name cannot be rebound through a public DNS hostname.
    map $host $form_valid_ipv4 {
        default 0;
        "~^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$" 1;
    }
    map "$form_valid_ipv4:$host" $form_private_host {
        default 0;
        "0:localhost" 1;
        "0:[::1]" 1;
        "~^1:(10\.|127\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)" 1;
        "~^0:[a-z0-9][a-z0-9.-]*\.local$" 1;
        "~*^0:\[(fc|fd|fe[89ab])[0-9a-f:]+\]$" 1;
    }
    access_log off;
    sendfile on;
    server_tokens off;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            default_type text/plain;
            return 200 "healthy\n";
        }

        location @form_address_rejected {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 403 '{"error":{"message":"The server rejected this site address. Check the configured app address."}}';
        }

        location /api/ {
            error_page 403 = @form_address_rejected;
            __LOCAL_GUARD__
            # Docker's embedded DNS also resolves a replaced API container.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://__API_UPSTREAM__;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization __AUTHORIZATION__;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_cache off;
            add_header Cache-Control "no-store" always;
        }

        location = /sw.js {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
